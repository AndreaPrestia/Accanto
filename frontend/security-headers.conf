# Header di sicurezza condivisi. Da `include`re in ogni `location` di nginx
# (gli `add_header` definiti a server-level sono ignorati nei location che
# hanno propri `add_header`, ad es. Cache-Control).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# CSP: NON impostato qui di proposito.
# - In produzione c'e' Caddy davanti che imposta CSP includendo il dominio
#   API (vedi deploy/Caddyfile, blocco {$ACCANTO_APP_DOMAIN}).
# - Se nginx aggiungesse anche un proprio CSP, il browser riceverebbe due
#   header `Content-Security-Policy` e applicherebbe l'intersezione delle
#   policy → la SPA non riuscirebbe piu' a chiamare https://api.<dominio>.
# - In dev locale (docker compose senza prod overlay) la SPA chiama /api/
#   che e' same-origin via reverse_proxy di nginx, quindi non serve un CSP
#   di base.

# Cross-Origin isolation (lieve, non require-corp per non rompere risorse
# di terze parti future).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
