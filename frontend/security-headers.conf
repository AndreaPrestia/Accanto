# Header di sicurezza condivisi. Da `include`re in ogni `location` di nginx
# (gli `add_header` definiti a server-level sono ignorati nei location che
# hanno propri `add_header`, ad es. Cache-Control).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# CSP per la SPA (stesso payload del blocco app.* nel Caddyfile, qui senza
# il dominio API separato perche' in dev nginx fa anche il reverse proxy
# di /api/* sullo stesso origin).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; object-src 'none'" always;

# Cross-Origin isolation (lieve, non require-corp per non rompere risorse
# di terze parti future).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
