server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Long cache for hashed assets (immutabili per hash).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Proxy verso l'Admin API (service accanto-admin-api). Il path pubblico e'
    # /admin-api/* → inoltrato a /api/admin/* dell'Admin API.
    location /admin-api/ {
        proxy_pass http://accanto-admin-api:8080/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Health dell'Admin API (utile per probe esterne).
    location = /admin-api-health {
        proxy_pass http://accanto-admin-api:8080/health/ready;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA fallback: nessun caching per l'HTML (sempre fresh).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
