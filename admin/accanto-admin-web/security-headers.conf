# Header di sicurezza condivisi per l'admin-web. Come per il frontend pubblico,
# il CSP NON e' impostato qui: in produzione lo gestisce Caddy al edge per
# evitare header CSP duplicati (il browser applica l'intersezione).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
