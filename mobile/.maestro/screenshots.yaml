# Screenshot flow: login con account demo → cattura le 5 schermate store.
#
# Uso locale (Android emulator):
#   $env:MAESTRO_APP_ID = "app.accanto.mobile.preview"   # dipende dalla build installata (.dev/.preview/prod)
#   $env:MAESTRO_EMAIL  = "demo@accanto.care"     # account con dati demo pre-popolati
#   $env:MAESTRO_PASSWORD = "***"
#   maestro test .maestro/screenshots.yaml
# Gli screenshot finiscono in ~/.maestro/tests/ (vedi `maestro test --output`).
#
# Uso in CI (iOS simulator, vedi .github/workflows/store-screenshots.yml):
#   maestro test --output screenshots/raw .maestro/screenshots.yaml
#
# N.B.: i nomi file prodotti da takeScreenshot sono quelli qui sotto; gli
# script in scripts/store/ li raccolgono e li rinominano/ridimensionano
# secondo le specifiche in store/screenshots/README.md.
appId: ${MAESTRO_APP_ID}
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
---
- launchApp:
    clearState: true

# ---- Login (riusa gli id di login.yaml) ---------------------------------
- assertVisible:
    id: "login-email"
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "login-submit"

# iOS AutoFill/Keychain: il dialog "Vuoi salvare la password?" (testo "Non
# ora") puo' apparire dopo il login e copre la Welcome. Tap su "Non ora":
# optional -> se il dialog non c'e', Maestro salta senza fallire. Sulla
# Dashboard non esiste testo "Non ora", quindi nessun rischio di tap a vuoto.
- tapOn:
    text: "Non ora"
    optional: true

# Onboarding gate: con clearState la Dashboard reindirizza a Welcome al primo
# accesso (hasSeenWelcome=false). Il link "Salta" era coperto dalla status bar
# per un bug SafeArea (Welcome con headerShown:false non riservava l'edge top):
# FIX LATO APP (WelcomeScreen ora passa edges=['top',...]). Ora "Salta" e'
# visibile e cliccabile: skip() -> navigation.replace('Dashboard'), percorso
# diretto senza NewCircle/back. optional: se la Welcome non appare (flag gia'
# visto), Maestro salta. Su Dashboard "Salta" non esiste -> nessun tap a vuoto.
- tapOn:
    text: "Salta"
    optional: true

# DEBUG: cattura lo schermo dopo il login+welcome per capire cosa appare.
- takeScreenshot: debug-after-login

# Attende che RootNavigator switchi su AppStack e mostri la dashboard.
# Timeout generoso: la dashboard fetcha i cerchi da prod, su CI puo' essere lenta.
- extendedWaitUntil:
    visible: "Il tuo spazio"
    timeout: 30000

# Attende che la fetch dei cerchi completi e la card "Famiglia Rossi" sia
# renderizzata (arriva DOPO il titolo "Il tuo spazio"). Senza questa attesa il
# tap e lo screenshot arrivano mentre la lista e' ancora in caricamento.
- extendedWaitUntil:
    visible: "Famiglia Rossi"
    timeout: 30000

# ---- 01 · Dashboard -------------------------------------------------------
- takeScreenshot: 01-dashboard

# ---- 02 · Timeline (dentro il primo cerchio) -----------------------------
# Il primo cerchio attivo della dashboard: tap sulla card (testo = nome
# cerchio dell'account demo). Se il nome cambia, aggiorna anche qui.
- tapOn: "Famiglia Rossi"
- extendedWaitUntil:
    visible: "Diario"
    timeout: 10000
- takeScreenshot: 02-timeline

# ---- 03 · Documents -------------------------------------------------------
- tapOn: "Documenti"
- takeScreenshot: 03-documents

# ---- 04 · DoctorQuestions -------------------------------------------------
- tapOn: "Domande"
- takeScreenshot: 04-doctor-questions

# ---- 05 · SelfCare (dal drawer) ------------------------------------------
# Torna alla dashboard e apri il drawer dall'hamburger ("Apri menu").
- back
- back
- tapOn: "Apri menu"
- tapOn: "Prenditi cura di te"
- extendedWaitUntil:
    visible: "Cura di te"
    timeout: 10000
- takeScreenshot: 05-self-care
