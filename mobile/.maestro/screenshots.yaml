# Screenshot flow: login con account demo → cattura le 5 schermate store.
#
# Uso locale (Android emulator):
#   $env:MAESTRO_APP_ID = "app.accanto.mobile.preview"   # dipende dalla build installata (.dev/.preview/prod)
#   $env:MAESTRO_EMAIL  = "demo@accanto.care"     # account con dati demo pre-popolati
#   $env:MAESTRO_PASSWORD = "***"
#   maestro test .maestro/screenshots.yaml
# Gli screenshot finiscono in ~/.maestro/tests/ (vedi `maestro test --output`).
#
# Uso in CI (iOS simulator, vedi .github/workflows/store-screenshots.yml):
#   maestro test --output screenshots/raw .maestro/screenshots.yaml
#
# N.B.: i nomi file prodotti da takeScreenshot sono quelli qui sotto; gli
# script in scripts/store/ li raccolgono e li rinominano/ridimensionano
# secondo le specifiche in store/screenshots/README.md.
appId: ${MAESTRO_APP_ID}
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
  # circleId del cerchio demo (Famiglia Rossi) per i deep link ai tab.
  MAESTRO_CIRCLE_ID: ${MAESTRO_CIRCLE_ID}
---
- launchApp:
    clearState: true

# ---- Login (riusa gli id di login.yaml) ---------------------------------
- assertVisible:
    id: "login-email"
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "login-submit"

# iOS AutoFill/Keychain: il dialog "Vuoi salvare la password?" (testo "Non
# ora") puo' apparire dopo il login e copre la Welcome. Tap su "Non ora":
# optional -> se il dialog non c'e', Maestro salta senza fallire. Sulla
# Dashboard non esiste testo "Non ora", quindi nessun rischio di tap a vuoto.
- tapOn:
    text: "Non ora"
    optional: true

# Onboarding gate: con clearState la Dashboard reindirizza a Welcome al primo
# accesso (hasSeenWelcome=false). Il link "Salta" era coperto dalla status bar
# per un bug SafeArea (Welcome con headerShown:false non riservava l'edge top):
# FIX LATO APP (WelcomeScreen ora passa edges=['top',...]). Ora "Salta" e'
# visibile e cliccabile: skip() -> navigation.replace('Dashboard'), percorso
# diretto senza NewCircle/back. optional: se la Welcome non appare (flag gia'
# visto), Maestro salta. Su Dashboard "Salta" non esiste -> nessun tap a vuoto.
- tapOn:
    text: "Salta"
    optional: true

# Attende che la Welcome SPARISCA dopo il tap "Salta" (skip() ->
# navigation.replace('Dashboard') non e' istantaneo). Senza questo, il flow
# proseguiva mentre era ancora sulla Welcome (visto in debug-after-login).
# optional: se la Welcome non c'era, notVisible e' gia' vero.
- extendedWaitUntil:
    notVisible: "Ti diamo il benvenuto"
    timeout: 15000
    optional: true

# Attende che RootNavigator switchi su AppStack e mostri la dashboard.
- extendedWaitUntil:
    visible: "Il tuo spazio"
    timeout: 30000

# DEBUG: cattura lo schermo dopo essere arrivati alla dashboard.
- takeScreenshot: debug-after-login

# Attende che la fetch dei cerchi completi e la card cerchio sia renderizzata.
# Uso regex PARZIALE "Famiglia" (non il testo esatto "Famiglia Rossi"): la card
# ha <Text numberOfLines={1} className="flex-shrink"> -> Maestro non matcha
# sempre la stringa completa (troncamento/misura), ma matcha il prefisso.
# Nel debug-after-login il cerchio E' visibile, quindi era un problema di match.
- extendedWaitUntil:
    visible: "Famiglia.*"
    timeout: 30000

# ---- 01 · Dashboard -------------------------------------------------------
- takeScreenshot: 01-dashboard

# Navigazione robusta via DEEP LINK (linking.ts) invece di tap sui tab:
# i tab in basso non sono matchabili in modo affidabile da Maestro (testo
# combinato con icona, tap "Diario" non trovato anche se visibile). I deep
# link portano direttamente alla schermata target. circleId dell'account demo
# passato via env MAESTRO_CIRCLE_ID. Scheme build preview: accanto.preview.
#   <scheme>://care-circles/:id/timeline | documents | questions
#   <scheme>://self-care

# N.B.: iOS mostra un dialog di SISTEMA "Open in 'Accanto (Preview)'?" (in
# inglese, e' del sistema non dell'app) con bottoni Cancel/Open dopo openLink.
# Serve tap su "Open" per confermare la navigazione, altrimenti si resta sulla
# schermata corrente. optional: se il dialog non appare, non blocca.

# ---- 02 · Timeline (Diario) ----------------------------------------------
- openLink: accanto.preview://care-circles/${MAESTRO_CIRCLE_ID}/timeline
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Diario"
    timeout: 15000
- takeScreenshot: 02-timeline

# ---- 03 · Documents -------------------------------------------------------
- openLink: accanto.preview://care-circles/${MAESTRO_CIRCLE_ID}/documents
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Documenti"
    timeout: 15000
- takeScreenshot: 03-documents

# ---- 04 · DoctorQuestions -------------------------------------------------
- openLink: accanto.preview://care-circles/${MAESTRO_CIRCLE_ID}/questions
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Domande"
    timeout: 15000
- takeScreenshot: 04-doctor-questions

# ---- 05 · SelfCare --------------------------------------------------------
- openLink: accanto.preview://self-care
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Cura di te"
    timeout: 10000
- takeScreenshot: 05-self-care
