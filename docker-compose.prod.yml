# docker-compose.prod.yml
#
# Override per deploy in produzione: usa le immagini pubblicate su GHCR
# (build skippato), rimuove l'esposizione pubblica di Postgres e backend,
# mette Caddy davanti ai 3 host pubblici (vetrina + SPA + API) con TLS
# automatico da Let's Encrypt.
#
# Uso:
#   ACCANTO_DOMAIN=accanto.care \
#   ACCANTO_APP_DOMAIN=app.accanto.care \
#   ACCANTO_API_DOMAIN=api.accanto.care \
#   ACCANTO_TLS_EMAIL=andrea.prestia@accanto.care \
#   ACCANTO_VERSION=v0.7.2 \
#   ASPNETCORE_ENVIRONMENT=Production \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Topologia HTTPS:
#  - https://${ACCANTO_DOMAIN}     → sito vetrina (Astro statico, container "web")
#  - https://${ACCANTO_APP_DOMAIN} → SPA React (solo statico, niente API)
#  - https://${ACCANTO_API_DOMAIN} → API .NET (anche /health, /health/ready)
#
# Prerequisiti:
#  - DNS A/AAAA dei 3 host puntano al server.
#  - Porte 80 e 443 raggiungibili da internet (necessarie per ACME challenge).
#  - File .env locale con i segreti veri (Encryption__MasterKey, Jwt__Key, POSTGRES_PASSWORD).
#  - Login a GHCR sul server (`docker login ghcr.io`) solo se le immagini sono private.

services:
  db:
    # Non esporre Postgres su internet.
    ports: !reset []

  backend:
    # In prod usa l'immagine pubblicata su GHCR (build skippato).
    image: ghcr.io/andreaprestia/accanto-backend:${ACCANTO_VERSION:-latest}
    # Non esporre il backend direttamente: ci arriva solo Caddy via rete interna.
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # CORS: la SPA gira su https://app.accanto.care e chiama https://api.accanto.care.
      # Il backend deve consentire l'origine SPA. Override via .env se servono più origini.
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-https://${ACCANTO_APP_DOMAIN:-app.${ACCANTO_DOMAIN}}}

  frontend:
    image: ghcr.io/andreaprestia/accanto-frontend:${ACCANTO_VERSION:-latest}
    # Non esporre il frontend direttamente: ci arriva solo Caddy.
    ports: !reset []
    expose:
      - "80"

  web:
    image: ghcr.io/andreaprestia/accanto-web:${ACCANTO_VERSION:-latest}
    # Sito vetrina solo dietro Caddy.
    ports: !reset []
    expose:
      - "80"

  # Modulo AI (profilo "ai"): in produzione NON va mai esposto su internet.
  # Il backend lo raggiunge via rete Docker interna come http://ollama:11434.
  # Per attivarlo in prod:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ai up -d
  ollama:
    ports: !reset []
    # Niente expose pubblico: solo i container nella stessa rete Docker possono raggiungerlo.

  # Log aggregator (profilo "observability"): in produzione la UI di Seq NON va mai esposta
  # su internet. Raggiungila in SSH tunnel (`ssh -L 5341:localhost:5341 ...`) o mettila
  # dietro Caddy con auth basic se proprio devi.
  seq:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACCANTO_DOMAIN: ${ACCANTO_DOMAIN:?ACCANTO_DOMAIN richiesto (es. accanto.care)}
      ACCANTO_APP_DOMAIN: ${ACCANTO_APP_DOMAIN:-app.${ACCANTO_DOMAIN}}
      ACCANTO_API_DOMAIN: ${ACCANTO_API_DOMAIN:-api.${ACCANTO_DOMAIN}}
      ACCANTO_TLS_EMAIL: ${ACCANTO_TLS_EMAIL:?ACCANTO_TLS_EMAIL richiesto per Let's Encrypt}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
