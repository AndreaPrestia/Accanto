# Header di sicurezza condivisi. Da `include`re in ogni `location` di nginx
# (gli `add_header` definiti a server-level sono ignorati nei location che
# hanno propri `add_header`, ad es. Cache-Control).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# CSP per il sito vetrina (Astro statico). Allinea con il Caddyfile:
# allow-list per Google Fonts (preconnect dichiarato nel <head>).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Cross-Origin isolation lieve.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
