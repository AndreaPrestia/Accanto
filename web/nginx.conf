server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Asset hashati di Astro: cache lunga
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sitemap e robots: niente cache aggressiva
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/sitemap.*\.xml$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Pagine: Astro emette /<locale>/<slug>/index.html con trailingSlash:'never'.
    # try_files prova URL letterale, .html, /index.html, poi 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}
