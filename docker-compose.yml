services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accanto}
      POSTGRES_USER: ${POSTGRES_USER:-accanto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accanto} -d ${POSTGRES_DB:-accanto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=db;Port=5432;Database=accanto;Username=accanto;Password=change-me-in-local}
      Jwt__Issuer: ${Jwt__Issuer:-accanto}
      Jwt__Audience: ${Jwt__Audience:-accanto}
      Jwt__Key: ${Jwt__Key:-please-change-me-to-a-long-random-secret-at-least-32-chars}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-480}
      Storage__RootPath: ${Storage__RootPath:-/data/storage}
      Storage__MaxFileSizeBytes: ${Storage__MaxFileSizeBytes:-20971520}
      Encryption__MasterKey: "${Encryption__MasterKey:?Encryption__MasterKey richiesta - genera con openssl rand -base64 32}"
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:5173,http://localhost:8081}
      # In sviluppo locale i rate limit sono volutamente rilassati per non bloccare i test E2E.
      # In produzione lasciare i default di RateLimitOptions (5/min login, 10/h register, ecc.).
      RateLimit__Login__PermitLimit: ${RateLimit__Login__PermitLimit:-10000}
      RateLimit__Login__Window: ${RateLimit__Login__Window:-00:01:00}
      RateLimit__Register__PermitLimit: ${RateLimit__Register__PermitLimit:-10000}
      RateLimit__Register__Window: ${RateLimit__Register__Window:-00:01:00}
      RateLimit__Sensitive__PermitLimit: ${RateLimit__Sensitive__PermitLimit:-10000}
      RateLimit__Sensitive__Window: ${RateLimit__Sensitive__Window:-00:01:00}
      RateLimit__InviteCreate__PermitLimit: ${RateLimit__InviteCreate__PermitLimit:-10000}
      RateLimit__InviteCreate__Window: ${RateLimit__InviteCreate__Window:-00:01:00}
    volumes:
      - ./storage:/data/storage
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
