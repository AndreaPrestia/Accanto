services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accanto}
      POSTGRES_USER: ${POSTGRES_USER:-accanto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local}
      # Password del ruolo runtime DML-only `accanto_app`, creato da
      # scripts/db/init/01-app-role.sh al primo init del volume. Se omessa
      # lo script si autodisabilita e l'app continua a usare POSTGRES_USER.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-me-in-local-app}
    volumes:
      - db-data:/var/lib/postgresql/data
      # /docker-entrypoint-initdb.d viene eseguito UNA SOLA volta sulla prima
      # creazione del volume db-data. Per riapplicare su dev DB esistente:
      # `docker compose down -v` e ricrea lo stack.
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accanto} -d ${POSTGRES_DB:-accanto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Init "one-shot" che corregge l'ownership di /data/storage prima dell'avvio
  # del backend. Necessario perche':
  # - il container backend gira come uid/gid 1654 (utente `app` chiseled);
  # - il bind mount `./storage` puo' avere file/dir owned by root creati da
  #   amministrazione manuale (es. `mkdir` o un upload partito quando il
  #   backend girava come root in passato);
  # - in quel caso `Directory.CreateDirectory` di sottocartelle (es. `2026/`)
  #   fallisce con "Access to the path '/data/storage/2026' is denied".
  #
  # Idempotente: se l'ownership e' gia' corretto, il chown e' un no-op.
  # Termina dopo l'esecuzione (restart: "no").
  storage-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1654:1654 /data/storage && chmod -R u+rwX /data/storage && echo 'storage ownership ok'"]
    volumes:
      - ./storage:/data/storage

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      # Runtime: ruolo `accanto_app` (DML only, niente DDL).
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=db;Port=5432;Database=accanto;Username=accanto_app;Password=change-me-in-local-app}
      # Migrator: ruolo `accanto` (proprietario, DDL permessa). Usato solo
      # all'avvio per applicare le migrazioni EF.
      ConnectionStrings__PostgresMigrator: ${ConnectionStrings__PostgresMigrator:-Host=db;Port=5432;Database=accanto;Username=accanto;Password=change-me-in-local}
      Jwt__Issuer: ${Jwt__Issuer:-accanto}
      Jwt__Audience: ${Jwt__Audience:-accanto}
      Jwt__Key: ${Jwt__Key:-please-change-me-to-a-long-random-secret-at-least-32-chars}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-480}
      Storage__RootPath: ${Storage__RootPath:-/data/storage}
      Storage__MaxFileSizeBytes: ${Storage__MaxFileSizeBytes:-20971520}
      Encryption__MasterKey: "${Encryption__MasterKey:?Encryption__MasterKey richiesta - genera con openssl rand -base64 32}"
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:5173,http://localhost:8081}
      # Reset password: base URL della SPA usata per costruire il link di reset.
      # Default vuoto = primo origin di Cors__AllowedOrigins. In prod imposta
      # esplicitamente https://app.<dominio> in .env per evitare ambiguita'.
      Auth__PasswordReset__PublicUrl: ${Auth__PasswordReset__PublicUrl:-}
      Auth__PasswordReset__ResetPath: ${Auth__PasswordReset__ResetPath:-/reset-password}
      Auth__PasswordReset__TokenLifetimeMinutes: ${Auth__PasswordReset__TokenLifetimeMinutes:-60}
      # Rate limit: i default sicuri per produzione vivono in RateLimitOptions.cs
      # (5/min login, 10/h register, 10/min sensitive, 20/h invite, 20/h ai).
      # Per rilassare i bucket in sviluppo (es. test E2E) usare docker-compose.override.yml
      # (auto-caricato da `docker compose up` quando NON si specificano -f).
      # Modulo AI: opt-in. Default "none" → endpoint rispondono 503. Per attivare Ollama:
      #   docker compose --profile ai up -d
      #   Ai__Provider=ollama in .env (e Ai__Endpoint=http://ollama:11434).
      Ai__Provider: ${Ai__Provider:-none}
      Ai__Endpoint: ${Ai__Endpoint:-http://ollama:11434}
      Ai__Model: ${Ai__Model:-llama3.2:3b}
      Ai__TimeoutSeconds: ${Ai__TimeoutSeconds:-60}
      Ai__MaxOutputTokens: ${Ai__MaxOutputTokens:-512}
      # Log centralizzato (Seq). Default vuoto = sink Seq disabilitato e
      # l'app logga solo su stdout. Per attivarlo: avvia il profilo
      # `observability` e imposta in .env:
      #   Logging__SeqUrl=http://seq:5341
      Logging__SeqUrl: ${Logging__SeqUrl:-}
      Logging__SeqApiKey: ${Logging__SeqApiKey:-}
      # Replica S3 documenti (IONOS Object Storage). Default disabilitata;
      # attivare in .env impostando S3DocumentReplica__Enabled=true e
      # configurando bucket + credenziali (vedi accanto-ops/backup-restore.md).
      S3DocumentReplica__Enabled: ${S3DocumentReplica__Enabled:-false}
      S3DocumentReplica__ServiceUrl: ${S3DocumentReplica__ServiceUrl:-}
      S3DocumentReplica__Region: ${S3DocumentReplica__Region:-}
      S3DocumentReplica__Bucket: ${S3DocumentReplica__Bucket:-}
      S3DocumentReplica__Prefix: ${S3DocumentReplica__Prefix:-documents/}
      S3DocumentReplica__AccessKeyId: ${S3DocumentReplica__AccessKeyId:-}
      S3DocumentReplica__SecretAccessKey: ${S3DocumentReplica__SecretAccessKey:-}
      # Email SMTP (notifiche: verifica email, password reset, inviti).
      # Default vuoto = EmailSender no-op (utile in dev). In prod imposta
      # SmtpHost + credenziali in .env (es. provider transactional come
      # SendGrid, Mailgun, Postmark, oppure SMTP gestito).
      Email__SmtpHost: ${Email__SmtpHost:-}
      Email__SmtpPort: ${Email__SmtpPort:-587}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
      Email__UseStartTls: ${Email__UseStartTls:-true}
      Email__FromAddress: ${Email__FromAddress:-}
      Email__FromName: ${Email__FromName:-Accanto}
      # Web Push (VAPID). Default vuoto = push disabilitato. Per generare
      # le chiavi: `npx web-push generate-vapid-keys`. Subject e' un mailto:
      # o URL https usato dal browser per contattare il publisher.
      Push__VapidPublicKey: ${Push__VapidPublicKey:-}
      Push__VapidPrivateKey: ${Push__VapidPrivateKey:-}
      Push__VapidSubject: ${Push__VapidSubject:-mailto:andrea.prestia@accanto.care}
      # ClamAV (scan antivirus upload). Default vuoto = NoopMalwareScanner.
      # Per attivare: `docker compose --profile av up -d` e in .env:
      #   ClamAV__Host=clamav  (nome del servizio nel compose)
      ClamAV__Host: ${ClamAV__Host:-}
      ClamAV__Port: ${ClamAV__Port:-3310}
      ClamAV__TimeoutSeconds: ${ClamAV__TimeoutSeconds:-30}
    volumes:
      - ./storage:/data/storage
    ports:
      - "8080:8080"
    # Nessun healthcheck definito qui: l'immagine runtime e' "chiseled"
    # (distroless) e non ha curl/wget. Nessun altro servizio dipende dalla
    # salute del backend; per probe esterni usare GET /health.
    # Hardening container (defense-in-depth):
    # - no-new-privileges blocca setuid escalation
    # - cap_drop ALL: il processo .NET non ha bisogno di capabilities Linux
    # - read_only rootfs: il binario non si modifica a runtime
    # - tmpfs su /tmp e /home/app/.aspnet per DataProtection keys e file
    #   temporanei (lo storage persistente continua a stare su /data/storage)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/app/.aspnet:size=8m,uid=1654,gid=1654,mode=0700

  frontend:
    build:
      # Monorepo: il contesto è la repo root in modo che il Dockerfile possa
      # copiare anche packages/shared/ (workspace `@accanto/shared`) richiesto
      # da frontend/package.json. Vedi frontend/Dockerfile per i dettagli.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"
    # Hardening container nginx-unprivileged.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=101,gid=101
      - /var/cache/nginx:size=32m,uid=101,gid=101

  # Sito vetrina statico (Astro). Indipendente dalla SPA: pensato per il dominio apex
  # mentre la SPA vive su un sottodominio "app.". In locale è esposto sulla 4321.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        SITE_URL: ${WEB_SITE_URL:-http://localhost:4321}
        PUBLIC_APP_URL: ${WEB_PUBLIC_APP_URL:-http://localhost:5173}
    restart: unless-stopped
    ports:
      - "4321:8080"
    # Hardening container nginx-unprivileged.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=101,gid=101
      - /var/cache/nginx:size=32m,uid=101,gid=101

  # Modulo AI (opzionale, self-hosted). Si avvia solo con profilo "ai":
  #   docker compose --profile ai up -d
  # Per usarlo dal backend, impostare in .env:
  #   Ai__Provider=ollama
  #   Ai__Endpoint=http://ollama:11434
  # e fare il pull del modello dopo il primo avvio:
  #   docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Log aggregator (Seq). Opt-in con profilo "observability":
  #   docker compose --profile observability up -d
  # Per spedirgli i log dal backend, abilita in .env:
  #   Logging__SeqUrl=http://seq:5341
  #   Logging__SeqApiKey=<facoltativo: lo configuri dalla UI di Seq>
  # UI Seq raggiungibile su http://localhost:5341 (in prod metterla dietro VPN o auth).
  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data
    ports:
      - "5341:80"

  # Antivirus sidecar (ClamAV). Opt-in con profilo "av":
  #   docker compose --profile av up -d
  # Per attivare lo scan lato backend imposta in .env:
  #   ClamAV__Host=clamav
  #   ClamAV__Port=3310
  # Il backend usa NoopMalwareScanner finche' ClamAV:Host resta vuoto, quindi
  # senza il profilo l'app continua a funzionare ma senza scan AV. clamd
  # impiega ~1 minuto al primo boot per caricare il DB delle firme.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ["av"]
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db-data:
  ollama-data:
  seq-data:
  clamav-data:

# La network di default e' nominata `edge` (sostituisce `accanto_default`)
# cosi' altri stack docker-compose sul server possono attaccarcisi via
# `networks: { edge: { external: true, name: edge } }` e farsi raggiungere
# da Caddy come reverse-proxy condiviso.
# Vedi deploy/sites.d/README.md per il workflow di un sito satellite.
networks:
  default:
    name: edge

